services:
  - type: web
    name: foodbridge-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: node server/index.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: HINDSIGHT_API_URL
        value: https://api.hindsight.vectorize.io
      - key: HINDSIGHT_API_KEY
        sync: false
      - key: HINDSIGHT_BANK_ID
        value: foodbridge
